# ========================================================
# MediCare Spring Boot Configuration
# ========================================================
server.port=${PORT:8080}
server.servlet.context-path=/api

spring.application.name=medicare-backend

# --------------------------------------------------------
# Database Configuration (MySQL / H2 Dual-Engine Support)
# --------------------------------------------------------
spring.profiles.active=dev

# MySQL Default Settings (Profile: prod / mysql)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/medicare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Auto-creates and syncs entity tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic schema.sql execution; JPA ddl-auto handles schema creation
spring.sql.init.mode=never

# --------------------------------------------------------
# Spring Security & JWT Configuration
# --------------------------------------------------------
medicare.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
medicare.jwt.expiration-ms=86400000

# --------------------------------------------------------
# CORS Configuration
# --------------------------------------------------------
medicare.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
